apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_PASSWORD, value: postgres }
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports: [{ port: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U postgres; do sleep 1; done"]
      containers:
        - name: api
          image: oliviabakes-api:ci
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - { name: PORT, value: "3000" }
            - { name: DB_SSL, value: "off" }
            - { name: DATABASE_URL, value: "postgres://postgres:postgres@postgres:5432/postgres" }
            - { name: JWT_SECRET, value: "ci-secret" }
            - { name: ADMIN_EMAIL, value: "admin@test.local" }
            - { name: ADMIN_PASSWORD, value: "AdminPass123" }
            - { name: STRIPE_SECRET_KEY, value: "sk_test_dummy" }
            - { name: STRIPE_WEBHOOK_SECRET, value: "whsec_test" }
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 2